name: Package Release

on:
  workflow_dispatch:
  workflow_call:

jobs:
  package:
    name: Assemble Distributable Release Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Boot Shim Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: boot-shim
          path: shim_artifacts/

      - name: Build ROM Package and Boot Image
        run: |
          mkdir -p output
          if [ -f "shim_artifacts/boot_shim.bin" ]; then
            echo "[+] Found compiled boot_shim.bin from CI build. Staging to shim/."
            cp shim_artifacts/boot_shim.bin shim/
            [ -f "shim_artifacts/boot_shim.elf" ] && cp shim_artifacts/boot_shim.elf shim/
          fi
          python3 tools/packaging/package_rom.py --output-dir output

      - name: Generate SHA-256 Checksums
        run: |
          cd output
          sha256sum X6871_iOS_ROM_Package.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to GoFile
        continue-on-error: true
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
        run: |
          python3 tools/packaging/upload_gofile.py output/X6871_iOS_ROM_Package.zip --manifest-out output/rom_package_gofile.json

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x6871-ios-rom-package
          path: |
            output/X6871_iOS_ROM_Package.zip
            output/X6871_iOS_ROM_Package.zip.sha256
            output/SHA256SUMS.txt
